iris.features.required=COMPUTE_SHADERS SSBO REVERSED_CULLING
shadow.enabled=true
shadow.culling=reversed

allowConcurrentCompute=true

# Buffer 0: Vertex/Quad buffer
#   16 (count + alignment padding) + 32 * MAX_VERTEX_COUNT = 16 + 32 * 33554432 = 1073741840 bytes
bufferObject.0 = 1073741840

# Buffer 1: Control buffer (bounds + counters + indirect dispatch args)
bufferObject.1 = 256

# Buffer 2: AABBs (32 bytes per quad)
bufferObject.2 = 268435456

# Buffer 3: Morton codes (4 bytes per quad)
bufferObject.3 = 33554432

# Buffer 4: Cluster indices (4 bytes per quad)
bufferObject.4 = 33554432

# Buffer 5: Parent IDs (4 bytes per quad)
bufferObject.5 = 33554432

# Buffer 6: BVH2 nodes (32 bytes each)
bufferObject.6 = 268435424

# Buffer 7: Sort scratch (ping-pong + histogram + totals)
bufferObject.7 = 75497472

# Indirect dispatch: sort upsweep/downsweep passes from buffer 1 offset 60
indirect.prepare1 = 1 60
indirect.prepare3 = 1 60
indirect.prepare4 = 1 60
indirect.prepare6 = 1 60
indirect.prepare7 = 1 60
indirect.prepare9 = 1 60
indirect.prepare10 = 1 60
indirect.prepare12 = 1 60
indirect.prepare13 = 1 60
indirect.prepare15 = 1 60
indirect.prepare16 = 1 60
indirect.prepare18 = 1 60
indirect.prepare19 = 1 60
indirect.prepare21 = 1 60
indirect.prepare22 = 1 60
indirect.prepare24 = 1 60
indirect.prepare25 = 1 60

# Indirect dispatch: HPLOC build from buffer 1 offset 84
indirect.composite = 1 84
