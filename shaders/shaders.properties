iris.features.required=COMPUTE_SHADERS SSBO REVERSED_CULLING
shadow.enabled=true
shadow.culling=false

separateAo=true

# quad data buffer
# 4 + 32 * MAX_QUAD_COUNT = 4 + 32 * 8388608 = 268435460 bytes
bufferObject.0 = 268435460

# oversized control buffer so i dont crash iris again oops :3
bufferObject.1 = 512

# AABBs (32 bytes per quad)
bufferObject.2 = 268435456

# mormon codes (4 bytes per quad)
bufferObject.3 = 33554432

# cluster indices (4 bytes per quad)
bufferObject.4 = 33554432

# pIDs (4 bytes per quad)
bufferObject.5 = 33554432

# BVH2 nodes (64 bytes each, child AABBs stored in parent)
bufferObject.6 = 536870848

# sort scratch (ping-pong + histogram + totals)
bufferObject.7 = 75497472

# texture infos (16 bytes * 65536 entries + 4 bytes)
bufferObject.8 = 1048580

# texture data (4 bytes * 268435456 texels = 1GiB)
bufferObject.9 = 1073741824

# quad positions (12 floats = 48 bytes per quad)
bufferObject.10 = 402653184

# sort upsweep/downsweep passes
indirect.prepare1 = 1 40
indirect.prepare3 = 1 40
indirect.prepare4 = 1 40
indirect.prepare6 = 1 40
indirect.prepare7 = 1 40
indirect.prepare9 = 1 40
indirect.prepare10 = 1 40
indirect.prepare12 = 1 40
indirect.prepare13 = 1 40
indirect.prepare15 = 1 40
indirect.prepare16 = 1 40
indirect.prepare18 = 1 40
indirect.prepare19 = 1 40
indirect.prepare21 = 1 40
indirect.prepare22 = 1 40
indirect.prepare24 = 1 40
indirect.prepare25 = 1 40

# hploc build
indirect.composite = 1 52

customTexture.blockAtlas = minecraft:textures/atlas/blocks.png
customTexture.normalAtlas = minecraft:textures/atlas/blocks_n.png
customTexture.specularAtlas = minecraft:textures/atlas/blocks_s.png
customTexture.agxLut = /lib/agx_lut.dat TEXTURE_2D RGB16 1024 32 RGB UNSIGNED_SHORT

screen = PATHTRACE [PT_OPTIONS] <empty> <empty> ALPHA_TEST ENTITY_TEXTURES ENTITY_PBR ENABLE_QUAD_VALIDATION ENABLE_SORT_VALIDATION ENTITY_TEXTURES_DEBUG ENABLE_DEBUG_OVERLAY WG_SIZE
sliders = DOF_FOCAL_LENGTH DOF_FSTOP DOF_FOCUS_DISTANCE DOF_SENSOR_WIDTH DOF_BLADES

screen.PT_OPTIONS = DOF_ENABLED DOF_AUTOFOCUS DOF_FOCAL_LENGTH DOF_FSTOP DOF_FOCUS_DISTANCE DOF_SENSOR_WIDTH DOF_BLADES

uniform.int.randomSeed = randomInt()
