# Photon weather inputs. World age drives coherent weather and cloud movement.
uniform.float.photonWorldAge = ((worldDay % 128) * 24000.0 + worldTime) / 20.0
uniform.float.photonBiomeTemperature = smooth(temperature * 2.0 - 1.0, 1000, 1000)
uniform.float.photonBiomeHumidity = smooth(rainfall * 2.0 - 1.0, 1000, 1000)
uniform.float.photonBiomeSnow = smooth(if(biome_precipitation == PPT_SNOW, 1.0, 0.0), 30, 30)
uniform.float.photonBiomeSandstorm = smooth(if(biome_category == CAT_DESERT || biome_category == CAT_MESA, 1.0, 0.0), 30, 30)
variable.float.photonLightningBase = if(equals(skyColor.r, skyColor.g, 0.01) && skyColor.r > 0.3, 1.0, 0.0)
uniform.float.photonLightning = smooth(if(lightningBoltPosition.w > 0.5, photonLightningBase, 0.0), 0.0, 0.75)
