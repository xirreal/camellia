iris.features.required=COMPUTE_SHADERS SSBO REVERSED_CULLING
shadow.enabled=true
shadow.culling=reversed

# broken on newer iris
#skipAllRendering=true

# Buffer 0: Vertex/Quad buffer
#   sizeof(Vertex) * MAX_VERTEX_COUNT + 4 = 28 * 33554432 + 4 = 939524100 bytes
bufferObject.0 = 939524100

# Buffer 1: Scene bounds (6 uints + padding = 32 bytes)
bufferObject.1 = 32

# Buffer 2: QuadLeaf buffer
#   sizeof(QuadLeaf) * MAX_QUAD_COUNT = 32 * 8388608 = 268435456 bytes
bufferObject.2 = 268435456
