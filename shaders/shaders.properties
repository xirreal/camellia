iris.features.required=COMPUTE_SHADERS SSBO REVERSED_CULLING CUSTOM_IMAGES
shadow.enabled=true
shadow.culling=false

separateAo=true

# Quad data buffers
#   bufferObject.0  = 4 + 32 * MAX_QUAD_COUNT  (QuadDataBuffer: 4-byte counter + 32-byte QuadData)
#   bufferObject.2  =     32 * MAX_QUAD_COUNT  (AABBBuffer)
#   bufferObject.3  =      4 * MAX_QUAD_COUNT  (MortonCodeBuffer)
#   bufferObject.4  =      4 * MAX_QUAD_COUNT  (ClusterIndexBuffer)
#   bufferObject.5  =      4 * MAX_QUAD_COUNT  (ParentIDBuffer)
#   bufferObject.6  =     64 * (MAX_QUAD_COUNT - 1)  (BVH2NodeBuffer: N-1 internal nodes)
#   bufferObject.7  =      9 * MAX_QUAD_COUNT  (SortScratchBuffer: keys + vals + pass hist + totals, with slack)
#   bufferObject.10 =     48 * MAX_QUAD_COUNT  (QuadPosBuffer)

#if MAX_QUAD_COUNT == 1048576
bufferObject.0  = 33554436
bufferObject.2  = 33554432
bufferObject.3  = 4194304
bufferObject.4  = 4194304
bufferObject.5  = 4194304
bufferObject.6  = 67108800
bufferObject.7  = 9437184
bufferObject.10 = 50331648
#elif MAX_QUAD_COUNT == 2097152
bufferObject.0  = 67108868
bufferObject.2  = 67108864
bufferObject.3  = 8388608
bufferObject.4  = 8388608
bufferObject.5  = 8388608
bufferObject.6  = 134217664
bufferObject.7  = 18874368
bufferObject.10 = 100663296
#elif MAX_QUAD_COUNT == 4194304
bufferObject.0  = 134217732
bufferObject.2  = 134217728
bufferObject.3  = 16777216
bufferObject.4  = 16777216
bufferObject.5  = 16777216
bufferObject.6  = 268435392
bufferObject.7  = 37748736
bufferObject.10 = 201326592
#elif MAX_QUAD_COUNT == 8388608
bufferObject.0  = 268435460
bufferObject.2  = 268435456
bufferObject.3  = 33554432
bufferObject.4  = 33554432
bufferObject.5  = 33554432
bufferObject.6  = 536870848
bufferObject.7  = 75497472
bufferObject.10 = 402653184
#elif MAX_QUAD_COUNT == 16777216
bufferObject.0  = 536870916
bufferObject.2  = 536870912
bufferObject.3  = 67108864
bufferObject.4  = 67108864
bufferObject.5  = 67108864
bufferObject.6  = 1073741760
bufferObject.7  = 150994944
bufferObject.10 = 805306368
#elif MAX_QUAD_COUNT == 33554432
bufferObject.0  = 1073741828
bufferObject.2  = 1073741824
bufferObject.3  = 134217728
bufferObject.4  = 134217728
bufferObject.5  = 134217728
bufferObject.6  = 2147483584
bufferObject.7  = 301989888
bufferObject.10 = 1610612736
#endif
# oversized control buffer so i dont crash iris again oops :3
bufferObject.1 = 512
# texture infos (16 bytes * 65536 entries + 4 bytes)
bufferObject.8 = 1048580
# texture data (4 bytes * 268435456 texels = 1GiB)
bufferObject.9 = 1073741824

# sort upsweep/downsweep passes
