iris.features.required=COMPUTE_SHADERS SSBO REVERSED_CULLING CUSTOM_IMAGES
shadow.enabled=true
shadow.culling=false

# Route AMD through assembled-triangle capture. Disable whole programs so
# NVIDIA/Intel never acquire a pass-through geometry stage.
#if defined(MC_GL_VENDOR_AMD) || defined(MC_GL_VENDOR_ATI) || defined(MC_GL_RENDERER_RADEON)
program.shadow_solid.enabled=false
program.shadow_cutout.enabled=false
program.shadow_water.enabled=false
program.shadow_entities.enabled=false
program.shadow_block.enabled=false
program.gbuffers_terrain.enabled=false
program.gbuffers_terrain_cutout.enabled=false
program.gbuffers_water.enabled=false
blend.gbuffers_textured_lit=off
#else
program.gbuffers_textured_lit.enabled=false
#endif

separateAo=true
oldLighting=false

# G-buffer outputs are surface attributes, not colors; blending mixes position,
# normal, and albedo from different surfaces.
blend.gbuffers_terrain=off
blend.gbuffers_terrain_cutout=off
blend.gbuffers_water=off
blend.gbuffers_entities=off
blend.gbuffers_block=off
blend.gbuffers_block_translucent=off
# Blend banner paint in albedo only; position and normal stay unblended.
blend.gbuffers_block_translucent.colortex8=SRC_ALPHA ONE_MINUS_SRC_ALPHA ONE ONE_MINUS_SRC_ALPHA

# mode 1 = Reference PT, mode 2 = BVH debug, mode 3 = nothing, mode 4 = Simple RT
#if MODE != 1
program.composite19.enabled=false
#endif
#if MODE == 1
program.setup3.enabled=ENABLE_BLOOM
program.setup4.enabled=ENABLE_BLOOM
program.composite20.enabled=ENABLE_BLOOM
program.composite21.enabled=ENABLE_BLOOM
program.composite22.enabled=ENABLE_BLOOM
program.composite23.enabled=ENABLE_BLOOM
program.composite24.enabled=ENABLE_BLOOM
#else
program.setup3.enabled=false
program.setup4.enabled=false
program.composite20.enabled=false
program.composite21.enabled=false
program.composite22.enabled=false
program.composite23.enabled=false
program.composite24.enabled=false
#endif
#if MODE != 2 && MODE != 4
program.composite18.enabled=false
#endif
program.composite15.enabled=ENABLE_SORT_VALIDATION
program.composite97.enabled=ENABLE_QUAD_VALIDATION
program.composite99.enabled=ENABLE_DEBUG_OVERLAY
#if BVH_WIDTH == 2
program.composite17.enabled=false
#endif

# Quad data buffers
#   bufferObject.0  =      4                     (QuadCountBuffer)
#   bufferObject.2  =     24 * MAX_QUAD_COUNT for BVH2, 112 * MAX_QUAD_COUNT for BVH4
#                        (AABB then one BVH4 frontier per binary node)
#   bufferObject.3  =      4 * MAX_QUAD_COUNT  (MortonCodeBuffer)
#   bufferObject.4  =      4 * MAX_QUAD_COUNT  (ClusterIndexBuffer)
#   bufferObject.5  =      4 * MAX_QUAD_COUNT  (ParentIDBuffer)
#   bufferObject.6  =     64 * (MAX_QUAD_COUNT - 1) for direct BVH2 traversal,
#                        32 * (MAX_QUAD_COUNT - 1) for the BVH4 intermediate
#   bufferObject.7  =      9 * MAX_QUAD_COUNT  (SortScratchBuffer: keys + vals + pass hist + global hist, with slack)
#   bufferObject.10 =     32 * MAX_QUAD_COUNT  (QuadGeometryBuffer)
#   bufferObject.11 =     16 * MAX_QUAD_COUNT  (QuadAttributesBuffer)

#if MAX_QUAD_COUNT == 1048576
bufferObject.0  = 4
#if BVH_WIDTH == 4
bufferObject.2  = 117440512
#else
bufferObject.2  = 25165824
#endif
bufferObject.3  = 4194304
bufferObject.4  = 4194304
bufferObject.5  = 4194304
#if BVH_WIDTH == 2
bufferObject.6  = 67108800
#else
bufferObject.6  = 33554400
#endif
bufferObject.7  = 9437184
bufferObject.10 = 33554432
bufferObject.11 = 16777216
#elif MAX_QUAD_COUNT == 2097152
